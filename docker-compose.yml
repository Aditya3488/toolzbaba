services:
  toolbox:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true # reaps the PO-token helper process cleanly
    volumes:
      - data:/data # CDN images + downloaded AI models (survives rebuilds)
      - jobs:/tmp/vd_jobs # finished files wait here (auto-deleted after 30 min)
    environment:
      MAX_CONCURRENT_JOBS: "3" # heavy jobs (video, AI) that run at the same time
      # PUBLIC_BASE_URL: "https://tools.example.com" # used in the links the Image-to-CDN tool gives out
      # CDN_RETENTION_DAYS: "30"   # auto-delete hosted images after N days (0 = keep forever)
      # CDN_MAX_TOTAL_MB: "5000"   # storage cap for hosted images
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 4g

volumes:
  data:
  jobs:
